name: Hourly Health Check

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    environment: health

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Execute Backend B health Function
        env:
          APPWRITE_BACKEND_B_ENDPOINT: ${{ vars.APPWRITE_BACKEND_B_ENDPOINT || 'https://cloud.appwrite.io/v1' }}
          APPWRITE_BACKEND_B_PROJECT_ID: ${{ vars.APPWRITE_BACKEND_B_PROJECT_ID }}
          APPWRITE_BACKEND_B_API_KEY: ${{ secrets.APPWRITE_BACKEND_B_API_KEY }}
          FUNCTION_ID: ${{ vars.APPWRITE_FUNCTION_HEALTH_CHECK_ID }}
        run: |
          if [ -z "$APPWRITE_BACKEND_B_API_KEY" ] || [ -z "$APPWRITE_BACKEND_B_PROJECT_ID" ] || [ -z "$FUNCTION_ID" ]; then
            echo "::error::Backend B endpoint, project ID, API key, and health Function ID are required."
            exit 1
          fi
          response=$(curl --fail-with-body --silent --show-error \
            -X POST "$APPWRITE_BACKEND_B_ENDPOINT/functions/$FUNCTION_ID/executions" \
            -H "X-Appwrite-Project: $APPWRITE_BACKEND_B_PROJECT_ID" \
            -H "X-Appwrite-Key: $APPWRITE_BACKEND_B_API_KEY" \
            -H "Content-Type: application/json" \
            --data '{"body":"{}","async":false}')
          echo "$response" | jq -e '.responseStatusCode == 200 or .responseStatusCode == 201' >/dev/null
